; esp-gba -- 44vba (vba-next fork) GBA emulator on ESP32-S3
;
; Board detected via esptool flash_id:
;   ESP32-S3 (QFN56) rev v0.2, embedded PSRAM 8MB (octal, R8 die), 16MB quad flash
;   USB bridge is a CH340/CH343 (1a86:*), so this is a third-party S3 board,
;   not a genuine Espressif DevKitC-1 (which ships a CP2102N).
;
; Pinned to espressif32@5.4.0 => ESP-IDF 4.4.x on purpose. IDF 5.x renamed
; esp_partition_mmap()'s handle type and the SPI_FLASH_MMAP_DATA enum, and moved
; the per-target CONFIG_ESP32S3_SPIRAM_SUPPORT to CONFIG_SPIRAM. Upstream 44vba
; is written against 4.4 and does not build on 5.x without source changes.

[platformio]
name = esp-gba
src_dir = port-esp32s3/main

[env:esp32s3]
platform = espressif32@5.4.0
framework = espidf
board = esp32-s3-devkitc-1

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; The esp32-s3-devkitc-1 manifest hardcodes flash_mode=qio, which is stamped
; into the image header and overrides CONFIG_ESPTOOLPY_FLASHMODE_* from
; sdkconfig. With QIO this board's ROM loader misreads the bootloader (loads a
; single bogus segment instead of the image's 3, then ets_loader.c:78 +
; watchdog reset, never reaching "entry").
board_build.flash_mode = qio

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Must match CONFIG_ESP_CONSOLE_UART_BAUDRATE in sdkconfig.defaults, which is
; what actually sets the device-side rate (see the note there -- it needs
; ESP_CONSOLE_UART_CUSTOM=y or Kconfig silently ignores it). This setting only
; affects `pio device monitor`.
monitor_speed = 1500000
monitor_filters = esp32_exception_decoder, time
